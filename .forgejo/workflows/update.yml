# Weekly update PRs. Host toplevels are only evaluated; the packages job also builds the custom
# packages whose derivation a bump changed (a failed build reverts that bump, is listed in the PR
# body and fails the job). New evaluation warnings are listed in the PR body (its pr-check then
# fails until they are fixed or added to .forgejo/known-warnings). Jobs run in a pinned Nix
# container on the shared Docker runner, one at a time (consumer evaluation of every host would
# OOM the runner if run in parallel). Secrets: BOT_TOKEN (bot account that can open PRs, not push
# main) and ATTIC_TOKEN (push to the binary cache); each is passed only to the steps that need it.
name: update
on:
  schedule:
    - cron: "0 18 * * 5" # Saturday 03:00 JST
  workflow_dispatch:
    inputs:
      consumers:
        description: "Consumers to evaluate (owner/repo, or owner/repo:host,host for some hosts ...); empty uses .forgejo/consumers"
        type: string
        required: false
        default: ""

env:
  # Flake inputs and outputs are also substituted from the private binary cache on attobox
  # (Attic, server-nix); an unreachable cache only costs the timeout, then Nix fetches as before.
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    extra-substituters = https://cache.attodao.cc/ci
    extra-trusted-public-keys = ci:srH2BUGXoEpH8toJDNpuJtyGSKfCpysKlKXydEZO9Z8=
    connect-timeout = 5
  # Where `attos-ci cache-push` pushes the fetched input sources (secret ATTIC_TOKEN).
  ATTIC_ENDPOINT: https://cache.attodao.cc/
  ATTIC_CACHE: ci
  # Consumers evaluated against each update; empty (scheduled runs) reads .forgejo/consumers.
  CONSUMERS: ${{ inputs.consumers }}

jobs:
  flake-inputs:
    runs-on: docker
    timeout-minutes: 60
    container:
      image: nixos/nix:2.35.3@sha256:ff480dbb23511aa1c10710aa068ceea5b93fed9bfce5f5379f3a6b07282cbc7b
    steps:
      - run: git clone -q -b main "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
      - run: nix run .#attos-ci -- update-shared
      - run: nix run .#attos-ci -- check-consumers --report-warnings $CONSUMERS
        env:
          FORGEJO_TOKEN: ${{ secrets.BOT_TOKEN }}
      - run: nix run .#attos-ci -- cache-push
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      - run: |
          nix run .#attos-ci -- pr update/flake-inputs "chore(flake): Home Manager・nixpkgs・固定inputを更新"
        env:
          FORGEJO_TOKEN: ${{ secrets.BOT_TOKEN }}

  packages:
    needs: flake-inputs
    if: ${{ !cancelled() }}
    runs-on: docker
    # Evaluation plus the builds of the bumped packages (usually a few per week, each a few
    # minutes; the container store starts empty, so build inputs come from cache.nixos.org).
    timeout-minutes: 90
    container:
      image: nixos/nix:2.35.3@sha256:ff480dbb23511aa1c10710aa068ceea5b93fed9bfce5f5379f3a6b07282cbc7b
    steps:
      - run: git clone -q -b main "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
      - run: nix run .#attos-ci -- update-packages
      - run: nix run .#attos-ci -- check-consumers --report-warnings $CONSUMERS
        env:
          FORGEJO_TOKEN: ${{ secrets.BOT_TOKEN }}
      - run: nix run .#attos-ci -- cache-push
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      - run: |
          nix run .#attos-ci -- pr update/packages "chore(packages): 自前パッケージとPiリソースを更新"
        env:
          FORGEJO_TOKEN: ${{ secrets.BOT_TOKEN }}
      # The PR keeps only the bumps that built; fail the job so a reverted bump is not missed.
      - run: |
          if [ -s .attos-ci-build-failures ]; then cat .attos-ci-build-failures; exit 1; fi

  images:
    needs: packages
    if: ${{ !cancelled() }}
    runs-on: docker
    timeout-minutes: 30
    container:
      image: nixos/nix:2.35.3@sha256:ff480dbb23511aa1c10710aa068ceea5b93fed9bfce5f5379f3a6b07282cbc7b
    steps:
      - run: git clone -q -b main "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
      - run: nix run --inputs-from . nixpkgs#renovate
        env:
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: ${{ github.server_url }}/api/v1
          RENOVATE_TOKEN: ${{ secrets.BOT_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_GIT_AUTHOR: attos-bot <bot@attodao.cc>
          LOG_LEVEL: info
