# Weekly update PRs; nothing is built here. Jobs run in a pinned Nix container on the
# shared Docker runner, one at a time (consumer evaluation of every host would OOM the
# runner if run in parallel). Secret: BOT_TOKEN (bot account that can open PRs, not push
# main); it is passed only to the steps that need it.
name: update
on:
  schedule:
    - cron: "0 18 * * 5" # Saturday 03:00 JST
  workflow_dispatch:
    inputs:
      consumers:
        description: "Consumer hosts to evaluate (owner/repo:host,host ...)"
        type: string
        required: false
        default: "AttODao/server-nix:attofort,attobox,hermes AttODao/personal-nix:attodesk,attolap"

env:
  NIX_CONFIG: "experimental-features = nix-command flakes"
  # Consumer hosts evaluated against each update; scheduled runs use the dispatch default.
  CONSUMERS: ${{ inputs.consumers || 'AttODao/server-nix:attofort,attobox,hermes AttODao/personal-nix:attodesk,attolap' }}

jobs:
  flake-inputs:
    runs-on: docker
    timeout-minutes: 60
    container:
      image: nixos/nix:2.35.3@sha256:ff480dbb23511aa1c10710aa068ceea5b93fed9bfce5f5379f3a6b07282cbc7b
    steps:
      - run: git clone -q -b main "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
      - run: nix run .#attos-ci -- update-shared
      - run: nix run .#attos-ci -- check-consumers $CONSUMERS
        env:
          FORGEJO_TOKEN: ${{ secrets.BOT_TOKEN }}
      - run: |
          nix run .#attos-ci -- pr update/flake-inputs "chore(flake): Home Manager・nixpkgs・固定inputを更新"
        env:
          FORGEJO_TOKEN: ${{ secrets.BOT_TOKEN }}

  packages:
    needs: flake-inputs
    if: ${{ !cancelled() }}
    runs-on: docker
    timeout-minutes: 60
    container:
      image: nixos/nix:2.35.3@sha256:ff480dbb23511aa1c10710aa068ceea5b93fed9bfce5f5379f3a6b07282cbc7b
    steps:
      - run: git clone -q -b main "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
      - run: nix run .#attos-ci -- update-packages
      - run: nix run .#attos-ci -- check-consumers $CONSUMERS
        env:
          FORGEJO_TOKEN: ${{ secrets.BOT_TOKEN }}
      - run: |
          nix run .#attos-ci -- pr update/packages "chore(packages): 自前パッケージとPiリソースを更新"
        env:
          FORGEJO_TOKEN: ${{ secrets.BOT_TOKEN }}

  images:
    needs: packages
    if: ${{ !cancelled() }}
    runs-on: docker
    timeout-minutes: 30
    container:
      image: nixos/nix:2.35.3@sha256:ff480dbb23511aa1c10710aa068ceea5b93fed9bfce5f5379f3a6b07282cbc7b
    steps:
      - run: git clone -q -b main "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" .
      - run: nix run --inputs-from . nixpkgs#renovate
        env:
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: ${{ github.server_url }}/api/v1
          RENOVATE_TOKEN: ${{ secrets.BOT_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_GIT_AUTHOR: attos-bot <bot@attodao.cc>
          LOG_LEVEL: info
