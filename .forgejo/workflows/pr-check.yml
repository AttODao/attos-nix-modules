# Evaluates a pull request (and main on demand): every flake check and the packages output of
# this flake (one nix process per check), then every nixosConfiguration of the consumer repos in
# .forgejo/consumers with this checkout as attos-nix-modules. Evaluation warnings missing from
# .forgejo/known-warnings fail the job. Finally the wiki option tables are rendered (not written;
# docs.yml pushes them after the merge). Nothing is built. The consumer repos are public; the only
# secret, ATTIC_TOKEN, goes to the cache-push step, which stores the fetched input sources in the
# binary cache. One job, so the evaluations run one at a time on the shared runner.
name: pr-check
on:
  pull_request:
  # Also after each merge: Forgejo gives secrets (ATTIC_TOKEN) only to runs on this repository's
  # own branches, so this run is the one that fills the binary cache with main's input sources.
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # Flake inputs and outputs are also substituted from the private binary cache on attobox
  # (Attic, server-nix); an unreachable cache only costs the timeout, then Nix fetches as before.
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    extra-substituters = https://cache.attodao.cc/ci
    extra-trusted-public-keys = ci:srH2BUGXoEpH8toJDNpuJtyGSKfCpysKlKXydEZO9Z8=
    connect-timeout = 5
  # Where `attos-ci cache-push` pushes the fetched input sources (secret ATTIC_TOKEN).
  ATTIC_ENDPOINT: https://cache.attodao.cc/
  ATTIC_CACHE: ci

jobs:
  eval:
    runs-on: docker
    timeout-minutes: 60
    container:
      image: nixos/nix:2.35.3@sha256:ff480dbb23511aa1c10710aa068ceea5b93fed9bfce5f5379f3a6b07282cbc7b
    steps:
      # GITHUB_REF is refs/pull/<n>/head for pull requests (AGit included) and the branch otherwise.
      - run: |
          git init -q .
          git fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %s'
      - run: nix run .#attos-ci -- check-consumers
      - run: nix run .#attos-ci -- cache-push
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      - run: nix run .#attos-ci -- docs
